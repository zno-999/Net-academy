<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NetAcademy - تواصل معنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0814, #1b143f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .landing-card {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            padding: 40px;
            color: #1e1b4b;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        nav a {
            color: #64748b;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
            transition: 0.3s;
        }
        nav a:hover, nav a.active {
            color: #f97316;
            font-weight: bold;
        }
        .content {
            display: flex;
            gap: 40px;
        }
        .info-section {
            flex: 1;
        }
        .info-section h1 {
            font-size: 32px;
            color: #0f172a;
            margin-bottom: 15px;
        }
        .info-section p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .contact-info {
            list-style: none;
            color: #334155;
            font-size: 14px;
        }
        .contact-info li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* نموذج الإرسال */
        .form-section {
            flex: 1;
            background: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #334155;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #f97316;
            box-shadow: 0 0 5px rgba(249, 115, 22, 0.2);
        }
        .form-group textarea {
            resize: none;
            height: 90px;
        }
        .send-btn {
            background: #f97316;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .send-btn:hover {
            background: #ea580c;
        }
        .footer-logo {
            margin-top: 30px;
            font-weight: bold;
            color: #0f172a;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <!-- شريط التنقل -->
        <header>
            <nav>
                <a href="new.html">الرئيسية</a>
                <a href="about.html">من نحن</a>
                <a href="courses.html">الخدمات</a>
                <a href="contactus.html" class="active">تواصل معنا</a>
            </nav>
            <div style="font-weight: bold; color: #1e1b4b; cursor: pointer;">☰</div>
        </header>

        <!-- المحتوى (معلومات التواصل + نموذج المراسلة) -->
        <div class="content">
            <div class="info-section">
                <h1>تواصل معنا</h1>
                <p>نحن هنا لمساعدتك في رحلتك التعليمية. إذا كان لديك أي استفسار حول مسارات الشبكات أو أنظمة التشغيل، فلا تتردد في مراسلتنا.</p>
                <ul class="contact-info">
                    <li>📧 البريد: support@netacademy.com</li>
                    <li>📞 الهاتف: +965 0000 0000</li>
                    <li>📍 الموقع: عبر الإنترنت (أكاديمية رقمية)</li>
                </ul>
            </div>

            <div class="form-section">
                <form id="contactForm">
                    <div class="form-group">
                        <label>الاسم الكريم</label>
                        <input type="text" id="name" placeholder="أدخل اسمك الكامل" required>
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>الرسالة</label>
                        <textarea id="message" placeholder="اكتب رسالتك أو استفسارك هنا..." required></textarea>
                    </div>
                    <button type="submit" class="send-btn">إرسال الرسالة</button>
                </form>
            </div>
        </div>

        <div class="footer-logo">
            NET • ACADEMY
        </div>
    </div>

    <script>
        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('شكراً لك! تم إرسال رسالتك بنجاح، وسنتواصل معك قريباً 🚀');
            contactForm.reset();
        });
    </script>

</body>
</html>
